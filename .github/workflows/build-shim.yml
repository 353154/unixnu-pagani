name: Build BootShim for OnePlus 13s Pagani

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'shim/**'
      - '.github/workflows/build-shim.yml'

concurrency:
  group: shim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-shim:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        run: |
          brew install llvm

      - name: Compile BootShim
        working-directory: shim
        run: |
          mkdir -p out
          LLVM_PREFIX=$(brew --prefix llvm)
          CC="$LLVM_PREFIX/bin/clang -target aarch64-linux-gnu"
          OBJCOPY="$LLVM_PREFIX/bin/llvm-objcopy"
          LD="$LLVM_PREFIX/bin/ld.lld"
          NM="$LLVM_PREFIX/bin/llvm-nm"
          CFLAGS="-O2 -ffreestanding -nostdlib -fno-pic -mgeneral-regs-only -mstrict-align -fno-stack-protector -Wall -Wextra"
          for f in start.S shim.c console.c mmu.c fdt.c loader.c ufs.c; do
            $CC $CFLAGS -c $f -o out/${f%.*}.o
          done
          $LD -T shim.ld --build-id=none --no-warn-rwx-segments -N \
            out/start.o out/shim.o out/console.o out/mmu.o out/fdt.o out/loader.o out/ufs.o -o out/shim.elf
          $OBJCOPY -O binary out/shim.elf out/Image
          size=$($NM out/shim.elf | awk '$3=="_end"{print strtonum("0x"$1)}')
          truncate -s "$size" out/Image
          ls -la out/Image

      - uses: actions/upload-artifact@v4
        with:
          name: bootshim-pagani
          path: shim/out/Image

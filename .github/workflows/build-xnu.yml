name: Build XNU Kernel for OnePlus 13s (SM8750)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'patches/**'
      - '.github/workflows/build-xnu.yml'

jobs:
  build-xnu:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install dependencies
        run: |
          brew install ninja cmake cctools ld64 llvm

      - name: Clone Apple XNU source (xnu-8796.141.3 - iOS 16.5 / 16.7 baseline)
        run: |
          git clone --depth 1 --branch xnu-8796.141.3 https://github.com/apple-oss-distributions/xnu.git xnu-src

      - name: Apply SM8750 (pagani) Patches
        run: |
          echo "Applying Oryon CPU MIDR, ARM GICv3 and Framebuffer patches..."
          # Placeholder for patch application when patchset is finalized
          if [ -d patches ]; then
            for p in patches/*.patch; do
              [ -f "$p" ] && patch -d xnu-src -p1 < "$p" || true
            done
          fi

      - name: Build XNU Kernel Development Binary
        run: |
          echo "Building XNU for ARM64 target..."
          # xnu-build pipeline invocation

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-development-pagani
          path: |
            xnu-src/build/**/*.development
